name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: pcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pcode/go.mod
          cache-dependency-path: pcode/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
